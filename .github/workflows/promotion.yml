name: Promotion policy
on:
  pull_request:
permissions:
  contents: read
jobs:
  promotion:
    runs-on: ubuntu-24.04
    container: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enforce promotion source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: node .github/scripts/promotion.cjs "$BASE_BRANCH" "$HEAD_BRANCH" "$HEAD_REPO" "$BASE_REPO"
