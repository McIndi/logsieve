name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    container: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check shared.js
          node --check logsieve.js
          node --check logsieve-worker.js
          node --check tests/browser/rendering.cjs
      - name: Run unit tests
        run: |
          node run_tests.js
          node tests/ci/empty-runner.cjs
          node tests/ci/promotion.cjs
  browser:
    needs: unit
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install matching test dependency
        run: npm install --prefix /tmp/logsieve-browser-tools --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Run Chromium rendering regressions
        env:
          NODE_PATH: /tmp/logsieve-browser-tools/node_modules
        run: node tests/browser/rendering.cjs
